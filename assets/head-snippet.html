<!--
  Tempel di dalam <head>.
  Asumsi aset di /assets/. Ganti yourdomain.com, nama brand, judul, dan deskripsi.
  URL og:image harus URL HTTPS absolut dan dapat diakses publik oleh crawler.
-->
<link rel="icon" href="/assets/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#000000">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ZioGold">
<meta property="og:title" content="ZioGold | Judul halaman Anda">
<meta property="og:description" content="Tulis deskripsi singkat halaman atau bisnis Anda di sini.">
<meta property="og:url" content="https://yourdomain.com/">
<meta property="og:image" content="https://yourdomain.com/assets/og-image.jpg">
<meta property="og:image:secure_url" content="https://yourdomain.com/assets/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo ZG berwarna emas di atas latar hitam">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ZioGold | Judul halaman Anda">
<meta name="twitter:description" content="Tulis deskripsi singkat halaman atau bisnis Anda di sini.">
<meta name="twitter:image" content="https://yourdomain.com/assets/og-image.jpg">

<!-- JSON-LD organisasi; sesuaikan nama dan domain dengan situs Anda. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "ZioGold",
  "url": "https://yourdomain.com/",
  "logo": {
    "@type": "ImageObject",
    "url": "https://yourdomain.com/assets/android-chrome-512x512.png",
    "width": 512,
    "height": 512
  }
}
</script>
